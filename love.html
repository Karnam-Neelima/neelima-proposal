<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>I Love You ❤️</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="container">


        <!-- Heart -->

        <div class="heart">
            💖
        </div>


        <!-- Love message -->

        <h1>
            I LOVE YOU ❤️
        </h1>


        <p>
            Will you accept my proposal? 💍
        </p>


        <!-- Buttons -->

        <div class="buttons">


            <!-- YES -->

            <button
                class="yes-btn"
                onclick="goToProposal()">

                YES ❤️

            </button>


            <!-- NO -->

            <button
                class="no-btn"
                id="loveNoButton">

                NO 😜

            </button>


        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
